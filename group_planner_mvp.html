<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Planner MVP</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#f6f7fb;color:#202124}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001;margin-bottom:18px}h1{margin-top:0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}button{margin-top:16px;background:#222;color:#fff;border:0;font-weight:700;cursor:pointer}.code{font-size:24px;font-weight:700;letter-spacing:2px}.hidden{display:none}.small{color:#666;font-size:14px}</style></head>
<body><div class="card"><h1>Group Planner MVP</h1><p>Create a friend group, receive an invite code, and save basic planning preferences locally.</p>
<label>Group name</label><input id="group" placeholder="Weekend Crew"><button onclick="createGroup()">Create Group</button><div id="created" class="hidden"><p>Invite code:</p><div id="code" class="code"></div><p class="small">Share this code with friends.</p></div></div>
<div class="card"><h2>Join & Add Preferences</h2><label>Invite code</label><input id="joinCode" placeholder="ABC123"><label>Your name</label><input id="name" placeholder="Alex"><label>Budget</label><select id="budget"><option>Under $25</option><option>$25-$50</option><option>$50-$100</option><option>$100+</option></select><label>Activity preference</label><input id="activity" placeholder="Food, outdoors, museums..."><label>Maximum travel distance (miles)</label><input id="distance" type="number" min="0" value="20"><label>Availability</label><input id="availability" placeholder="Saturday afternoon"><button onclick="savePrefs()">Save Preferences</button><p id="status"></p></div>
<script>
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function createGroup(){const name=document.getElementById('group').value.trim();if(!name){alert('Enter a group name.');return;}const code=makeCode();localStorage.setItem('group_'+code,JSON.stringify({name:name,members:[]}));document.getElementById('code').textContent=code;document.getElementById('joinCode').value=code;document.getElementById('created').classList.remove('hidden');}
function savePrefs(){const code=document.getElementById('joinCode').value.trim().toUpperCase();const raw=localStorage.getItem('group_'+code);if(!raw){document.getElementById('status').textContent='Group not found. Check the invite code.';return;}const data=JSON.parse(raw);const member={name:document.getElementById('name').value.trim(),budget:document.getElementById('budget').value,activity:document.getElementById('activity').value.trim(),distance:document.getElementById('distance').value,availability:document.getElementById('availability').value.trim()};if(!member.name){document.getElementById('status').textContent='Enter your name.';return;}data.members.push(member);localStorage.setItem('group_'+code,JSON.stringify(data));document.getElementById('status').textContent='Preferences saved for '+member.name+' in '+data.name+'.';}
</script></body></html>
